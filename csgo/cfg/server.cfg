// server.cfg - general server settings, run every map.
//
// Server name, join password, RCON password, admin password and LAN/Internet
// are NOT set here: start_server.bat asks for them on first run and saves them
// in cfg\csgo_match\server_settings.cfg. If you add them here the setup
// comments them out again so they can never clash.
//
// Match rules live in cfg\csgo_match\*.cfg and the !options menu.

sv_cheats 0
sv_region 255
sv_steamgroup_exclusive 0

// Network rates (128 tick; also fine for 64 tick)
sv_maxrate 0
sv_minrate 128000
sv_mincmdrate 128
sv_maxcmdrate 128
sv_minupdaterate 128
sv_maxupdaterate 128

// Downloads: players fetch missing maps from FastDL (cfg\csgo_match\fastdl.cfg)
sv_allowdownload 1
sv_allowupload 0

// GOTV - needed for match demo recording
tv_enable 1
tv_autorecord 0
tv_delay 30
tv_advertise_watchable 1

// Logging
log on
sv_logfile 1
sv_log_onefile 0
sv_logbans 1

// Server browser info
host_name_store 1
host_info_show 1
host_players_show 2

// From the CS:GO Legacy Server setup (FNScence)
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_auto_full_alltalk_during_warmup_half_end 1

// No end-of-match map vote (the match plugin handles map changes)
mp_endmatch_votenextmap 0

// Bots on the hardest difficulty (3 = Expert) in every mode
bot_difficulty 3

// No warmup in any game mode (the match plugin runs its own waiting-for-!ready round)
mp_do_warmup_period 0
mp_warmuptime 0
